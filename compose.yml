name: haskell-reverse-proxy

services:
  aenebris-console:
    image: nginx:alpine
    container_name: aenebris-proxy-console
    ports:
      - "${AENEBRIS_PORT:-8014}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

  aenebris-ai-bridge:
    image: python:3.11-alpine
    container_name: aenebris-ai-bridge
    command: >
      python3 -c "print('Hindsight AI Connected for Aenebris Haskell Proxy')"
    restart: "no"
